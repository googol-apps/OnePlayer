# 🚀 CI/CD Pipeline for Android App
# Automates build, signing, release notes, and Play Store deployment.
name: CI/CD Pipeline

# -------------------------------------------------------------------------------------------------
# Trigger Configuration
# -------------------------------------------------------------------------------------------------
on:
  push:
    branches:
      - 'beta' # 🔧 Temporary branch; switch to 'master' once stable
  workflow_dispatch: # ▶️ Manual trigger from Actions tab
    inputs:
      max_commits:
        description: "Release notes up to:"
        required: false
        default: "1"

# -------------------------------------------------------------------------------------------
# 📂 Job
# -------------------------------------------------------------------------------------------
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------------------------------------------------------------------
      # 📂 Step 1: Checkout source code
      # -------------------------------------------------------------------------------------------
      - name: Checkout Codebase
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # full git history

      # -------------------------------------------------------------------------------------------
      # 📝 Step 2: Generate release notes (restricted by 3)
      # -------------------------------------------------------------------------------------------
      - name: Generate Release Notes
        id: notes
        run: |
          # Make sure we have enough commits fetched
          git fetch --prune --unshallow 2>/dev/null || git fetch --prune
          # Use MAX_COMMITS from workflow input, default to 1
          MAX_COMMITS="${{ github.event.inputs.max_commits || 1 }}"
          echo "Using MAX_COMMITS=$MAX_COMMITS"
          # Build the notes header first
          notes="## What's new
          "
          
          # Take the last MAX_COMMITS from the current branch only, no merges
          commit_notes=$(git log HEAD --no-merges --first-parent -n $MAX_COMMITS \
            --pretty=format:"- %s (%h)")
  

          # Combine
          notes="$notes$commit_notes"
          
          # If there are no commits, provide a fallback message
          if [ -z "$notes" ]; then
            notes="No new commits found."
          fi
          # Output to GitHub Actions
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------------------------
      #  📦 Step 3: Cache Gradle dependencies for faster builds
      # -------------------------------------------------------------------------------------------
      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # -------------------------------------------------------------------------------------------
      # ⚙️ Step 4: Configure environment variables (date, secrets, version tag)
      # -------------------------------------------------------------------------------------------
      - name: Configure Environment Variables
        run: |
          echo "DATE_TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "PLAY_CONSOLE_APP_RSA_KEY=$(echo ${{ secrets.PLAY_CONSOLE_APP_RSA_KEY }})" >> $GITHUB_ENV
          echo "ADS_APP_ID=$(echo ${{ secrets.ADS_APP_ID }})" >> $GITHUB_ENV
          echo "GIT_TAG=$(grep -E "versionName\s*=?\s*['\"]" "app/build.gradle.kts" | awk -F"['\"]" '{print $2}')" >> $GITHUB_ENV

      # -------------------------------------------------------------------------------------------
      # 🔍 Step 5: Verify secrets and variables are correctly set
      # -------------------------------------------------------------------------------------------
      - name: Verify Environment Variables
        run: |
          echo $ADS_APP_ID | sed 's/./&‌/g'
          echo $PLAY_CONSOLE_APP_RSA_KEY | sed 's/./&‌/g'
          echo $GIT_TAG | sed 's/./&‌/g'

      # -------------------------------------------------------------------------------------------
      # ☕ Step 6: Install Java 21 (Zulu) with Gradle cache
      # -------------------------------------------------------------------------------------------
      - name: Set Up Java and Gradle
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      # -------------------------------------------------------------------------------------------
      # 🏗️ Step 7: Build APK + AAB (all flavors)
      # -------------------------------------------------------------------------------------------
      - name: Build App
        run: |
          chmod +x ./gradlew
          ./gradlew \
            assembleStandardRelease \
            bundleStandardRelease \
            assembleCommunityRelease \
            bundlePlusRelease \
            bundleGoldRelease \
            --parallel \
            --configure-on-demand \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"

      # -------------------------------------------------------------------------------------------
      # 🛠️ Step 8: Detect latest Android build tools version
      # -------------------------------------------------------------------------------------------
      - name: Determine Build Tools Version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      # -------------------------------------------------------------------------------------------
      # 🔐 Step 9: Sign APKs/AABs for each flavor
      # -------------------------------------------------------------------------------------------
      - name: Signing STANDARD APK
        uses: r0adkll/sign-android-release@v1
        id: signed_standard_apk
        with:
          releaseDirectory: app/build/outputs/apk/standard/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Signing COMMUNITY APK
        uses: r0adkll/sign-android-release@v1
        id: signed_community_apk
        with:
          releaseDirectory: app/build/outputs/apk/community/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Sign STANDARD AAB
        uses: r0adkll/sign-android-release@v1
        id: signed_standard_aab
        with:
          releaseDirectory: app/build/outputs/bundle/standardRelease/
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Sign PLUS AAB
        uses: r0adkll/sign-android-release@v1
        id: signed_plus_aab
        with:
          releaseDirectory: app/build/outputs/bundle/plusRelease/
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Sign GOLD AAB
        uses: r0adkll/sign-android-release@v1
        id: signed_gold_aab
        with:
          releaseDirectory: app/build/outputs/bundle/goldRelease/
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      # -------------------------------------------------------------------------------------------
      # 📦 Step 10: Create GitHub Release with signed artifacts
      # -------------------------------------------------------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.GIT_TAG }}
          generate_release_notes: false
          body: ${{ steps.notes.outputs.notes }}
          prerelease: true
          files: |
            ${{steps.signed_standard_apk.outputs.signedReleaseFile}}
            ${{steps.signed_standard_aab.outputs.signedReleaseFile}}
            ${{steps.signed_community_apk.outputs.signedReleaseFile}}

      # -------------------------------------------------------------------------------------------
      # 📲 Step 11: Deploy signed AABs to Play Console (internal track)
      # -------------------------------------------------------------------------------------------
      - name: Deploy STANDARD Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.googol.android.apps.oneplayer
          releaseFiles: ${{steps.signed_standard_aab.outputs.signedReleaseFile}}
          track: internal
          whatsNewDirectory: ./whatsnew

      # Uploading Signed AAB to internal track of PlayConsole
      - name: Deploy Plus to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.googol.android.apps.oneplayer.pro
          releaseFiles: ${{steps.signed_plus_aab.outputs.signedReleaseFile}}
          track: internal
          whatsNewDirectory: ./whatsnew